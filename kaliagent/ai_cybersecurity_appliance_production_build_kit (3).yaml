# ============================================================
# 1. DATABASE SCHEMA (POSTGRES)
# ============================================================

-- users
CREATE TABLE users (
  id UUID PRIMARY KEY,
  email TEXT UNIQUE,
  password_hash TEXT,
  tenant_id UUID,
  role TEXT
);

-- tenants
CREATE TABLE tenants (
  id UUID PRIMARY KEY,
  name TEXT
);

-- projects
CREATE TABLE projects (
  id UUID PRIMARY KEY,
  tenant_id UUID,
  name TEXT,
  created_at TIMESTAMP DEFAULT now()
);

-- targets
CREATE TABLE targets (
  id UUID PRIMARY KEY,
  project_id UUID,
  ip TEXT
);

-- scans
CREATE TABLE scans (
  id UUID PRIMARY KEY,
  project_id UUID,
  status TEXT,
  created_at TIMESTAMP DEFAULT now()
);

-- findings
CREATE TABLE findings (
  id UUID PRIMARY KEY,
  scan_id UUID,
  name TEXT,
  severity TEXT,
  cve TEXT,
  description TEXT
);


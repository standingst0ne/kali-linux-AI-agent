# ============================================================
# AI CYBERSECURITY APPLIANCE (CLIENT-FACING)
# FULL DOCKER COMPOSE STACK
# ============================================================

version: '3.9'

services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - control_net

  broker:
    build: ./broker
    container_name: broker
    restart: unless-stopped
    networks:
      - control_net
      - sandbox_net
    ports:
      - "127.0.0.1:8080:8080"

  planner:
    build: ./agents/planner
    networks:
      - control_net

  executor:
    build: ./agents/executor
    networks:
      - control_net

  auditor:
    build: ./agents/auditor
    networks:
      - control_net

  ui:
    build: ./ui
    ports:
      - "3000:3000"
    networks:
      - control_net

  nmap:
    build: ./tools/nmap
    networks:
      - sandbox_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  dvwa:
    image: vulnerables/web-dvwa
    networks:
      - target_net

  juice_shop:
    image: bkimminich/juice-shop
    networks:
      - target_net

networks:
  control_net:
    driver: bridge
  sandbox_net:
    driver: bridge
    internal: true
  target_net:
    driver: bridge
    internal: true

volumes:
  ollama_data:

# ============================================================
# FIREWALL RULES (HOST - IPTABLES)
# ============================================================
# Copy/paste on host

# Default deny
iptables -P OUTPUT DROP
iptables -P INPUT DROP
iptables -P FORWARD DROP

# Allow localhost
iptables -A INPUT -i lo -j ACCEPT
iptables -A OUTPUT -o lo -j ACCEPT

# Allow UI access
iptables -A INPUT -p tcp --dport 3000 -j ACCEPT

# Allow broker local
iptables -A INPUT -p tcp --dport 8080 -s 127.0.0.1 -j ACCEPT

# Allow Docker internal
iptables -A FORWARD -i docker0 -o docker0 -j ACCEPT


# Minimal hardened broker

"""
from flask import Flask, request, jsonify
import subprocess, json

app = Flask(__name__)

ALLOWED = {
  "nmap": ["-sV","-Pn"]
}

@app.route('/run', methods=['POST'])
def run():
    cmd = request.json

    tool = cmd.get("tool")
    args = cmd.get("args", [])

    if tool not in ALLOWED:
        return jsonify({"error":"tool not allowed"}), 403

    for a in args:
        if a.startswith("-") and a not in ALLOWED[tool]:
            return jsonify({"error":"bad arg"}), 403

    result = subprocess.run([tool]+args, capture_output=True, text=True, timeout=30)
    return jsonify({"output": result.stdout[:2000]})

app.run(host='0.0.0.0', port=8080)
"""

